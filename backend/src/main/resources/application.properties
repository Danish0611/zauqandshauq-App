server.port=${PORT:8080}
spring.application.name=zauqandshauq-api
server.error.include-message=always
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
app.payment.razorpay-key-id=${RAZORPAY_KEY_ID:rzp_test_TrnvmqpEGpgwfa}
app.payment.razorpay-key-secret=${RAZORPAY_KEY_SECRET:Du3jki4aIKD08SxBI4PB3sIu}
app.payment.razorpay-webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}
app.auth.jwt-secret=${JWT_SECRET:zauqandshauq-luxury-fragrance-jwt-secret-key-2026-secure}
app.auth.jwt-expiration-ms=${JWT_EXPIRATION_MS:604800000}
logging.level.com.zauqandshauq=INFO

# PostgreSQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:zauqandshauq}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Spring Data JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Multipart File Configuration for CSV Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Transactional Email (SMTP) Configuration
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:hello@zauqandshauq.in}
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USER:}
spring.mail.password=${SMTP_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
