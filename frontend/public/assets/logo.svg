<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Silk Champagne Sand Metallic Gradient matching user logo -->
    <linearGradient id="silkSandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEDBCB" />
      <stop offset="40%" stop-color="#DEC3A8" />
      <stop offset="75%" stop-color="#CBAD91" />
      <stop offset="100%" stop-color="#B89B7E" />
    </linearGradient>

    <!-- Deep Imperial Teal/Emerald Tile Background -->
    <linearGradient id="imperialTileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4A40" />
      <stop offset="50%" stop-color="#0A3F35" />
      <stop offset="100%" stop-color="#052822" />
    </linearGradient>

    <!-- Drop Shadow for Dimensional Floating Depth -->
    <filter id="monogramShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#021410" flood-opacity="0.5" />
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#EEDBCB" flood-opacity="0.25" />
    </filter>

    <!-- Interlocking Ribbon Shadow -->
    <filter id="underlapShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="2" dy="4" stdDeviation="3.5" flood-color="#041E19" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Deep Imperial Emerald Plaque with Fine Gold Border -->
  <rect width="500" height="500" rx="84" fill="url(#imperialTileGrad)" />
  <rect width="494" height="494" x="3" y="3" rx="81" fill="none" stroke="#D8BFA7" stroke-width="1.5" stroke-opacity="0.32" />

  <!-- Ambient Vignette -->
  <radialGradient id="vignetteAura" cx="50%" cy="50%" r="55%">
    <stop offset="60%" stop-color="#000000" stop-opacity="0" />
    <stop offset="100%" stop-color="#021410" stop-opacity="0.5" />
  </radialGradient>
  <rect width="500" height="500" rx="84" fill="url(#vignetteAura)" />

  <!-- ==========================================================
       MAISON ZAUQ & SHAUQ MONOGRAM (Z + S)
       Corrected, mathematically smooth Bezier curves
       Zero jagged artifacts, pristine anti-aliased luxury vector
       ========================================================== -->
  <g id="zs-monogram" transform="translate(250, 250)" filter="url(#monogramShadow)">

    <!-- 1. TOP WING (Outer Z Upper Sweeping Petal) -->
    <path d="M 112 -170 
             C 48 -170, -28 -152, -92 -106 
             C -138 -72, -164 -18, -164 34 
             L -108 34 
             C -108 -6, -86 -48, -52 -72 
             C -20 -95, 24 -112, 112 -112 
             Z" 
          fill="url(#silkSandGrad)" />

    <!-- 2. BOTTOM WING (Outer Z Lower Sweeping Petal - 180° Rotational Symmetry) -->
    <path d="M -112 170 
             C -48 170, 28 152, 92 106 
             C 138 72, 164 18, 164 -34 
             L 108 -34 
             C 108 6, 86 48, 52 72 
             C 20 95, -24 112, -112 112 
             Z" 
          fill="url(#silkSandGrad)" />

    <!-- 3. CENTRAL INTERLOCKING 'S' GLYPH -->

    <!-- S Upper Hook & Shoulder -->
    <path d="M -58 -74
             L 54 -74
             C 80 -74, 98 -54, 98 -28
             L 98 -12
             L 44 -12
             L 44 -24
             C 44 -30, 38 -36, 30 -36
             L -58 -36
             Z"
          fill="url(#silkSandGrad)"
          filter="url(#underlapShadow)" />

    <!-- S Central Diagonal Stem -->
    <path d="M 44 -14
             L -38 42
             L -84 42
             C -94 42, -100 34, -100 22
             L -100 4
             L -46 4
             L -46 16
             C -46 22, -40 26, -34 26
             L 2 26
             L 44 -8
             Z"
          fill="url(#silkSandGrad)" />

    <!-- S Center Interlock Overlay -->
    <path d="M -52 -10
             C -36 15, 12 20, 54 20
             L 86 20
             C 100 20, 110 30, 110 44
             L 110 70
             L 56 70
             L 56 56
             C 56 48, 50 42, 42 42
             L -20 42
             C -50 42, -70 22, -70 -4
             Z"
          fill="url(#silkSandGrad)"
          filter="url(#underlapShadow)" />

    <!-- S Lower Hook & Base -->
    <path d="M 58 74
             L -54 74
             C -80 74, -98 54, -98 28
             L -98 12
             L -44 12
             L -44 24
             C -44 30, -38 36, -30 36
             L 58 36
             Z"
          fill="url(#silkSandGrad)"
          filter="url(#underlapShadow)" />

    <!-- Crisp 45° Corner Chamfer Facets -->
    <polygon points="112,-170 112,-112 74,-112" fill="#BFA38B" opacity="0.7" />
    <polygon points="-112,170 -112,112 -74,112" fill="#BFA38B" opacity="0.7" />

    <!-- Depth Shadow Ribbon at Central Crossing -->
    <path d="M -20 -14 L 38 -14 L -8 24 L -64 24 Z" 
          fill="#05241E" 
          opacity="0.4" />
  </g>
</svg>
