<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Silk Champagne Sand Gradient -->
    <linearGradient id="sandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAD7C5" />
      <stop offset="50%" stop-color="#D8BFA7" />
      <stop offset="100%" stop-color="#C5AA91" />
    </linearGradient>

    <!-- Deep Teal Velvet Gradient for Emblem Badge -->
    <linearGradient id="tealBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E4A40" />
      <stop offset="60%" stop-color="#0A3F35" />
      <stop offset="100%" stop-color="#062822" />
    </linearGradient>

    <!-- Drop Shadow for 3D Interlocking Depth -->
    <filter id="subtleDepth" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#021411" flood-opacity="0.45" />
    </filter>

    <!-- Interlock Shadow Overlay -->
    <filter id="castShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="4" stdDeviation="3" flood-color="#041E19" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Deep Imperial Emerald Rounded Plaque / Tile -->
  <rect width="500" height="500" rx="64" fill="url(#tealBg)" />
  <rect width="496" height="496" x="2" y="2" rx="62" fill="none" stroke="#D8BFA7" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Inner Ambient Vignette -->
  <radialGradient id="vignette" cx="50%" cy="50%" r="50%">
    <stop offset="50%" stop-color="#000000" stop-opacity="0" />
    <stop offset="100%" stop-color="#021410" stop-opacity="0.4" />
  </radialGradient>
  <rect width="500" height="500" rx="64" fill="url(#vignette)" />

  <!-- ========================================================
       THE "ZAUQ & SHAUQ" GEOMETRIC INTERLOCKING MONOGRAM (Z + S)
       Precise vector translation from Maison reference
       ======================================================== -->
  <g id="monogram-emblem" transform="translate(250, 250)">

    <!-- Top Petal / Outer Z Upper Wing -->
    <!-- Sweeps from top-right down along the left perimeter to form the upper lobe of 'Z' -->
    <path d="M 95 -152 
             C 45 -155, -20 -148, -75 -110 
             C -118 -80, -148 -32, -150 25
             L -102 25
             C -100 -12, -78 -46, -45 -66
             C -12 -84, 30 -88, 65 -86
             L 65 -152 Z" 
          fill="url(#sandGradient)" 
          filter="url(#subtleDepth)" />

    <!-- Bottom Petal / Outer Z Lower Wing (180deg Rotational Symmetry) -->
    <!-- Sweeps from bottom-left up along the right perimeter to form the lower lobe of 'Z' -->
    <path d="M -95 152 
             C -45 155, 20 148, 75 110 
             C 118 80, 148 32, 150 -25
             L 102 -25
             C 100 12, 78 46, 45 66
             C 12 84, -30 88, -65 86
             L -65 152 Z" 
          fill="url(#sandGradient)" 
          filter="url(#subtleDepth)" />

    <!-- Central Sculpted Geometric 'S' Glyphs & Weave Accents -->
    
    <!-- S Upper Hook / Cap -->
    <path d="M -58 -66
             L 38 -66
             C 56 -66, 72 -50, 72 -32
             L 72 -18
             L 24 -18
             L 24 -26
             C 24 -30, 20 -34, 16 -34
             L -58 -34 Z" 
          fill="url(#sandGradient)" 
          filter="url(#castShadow)" />

    <!-- Central Diagonal Spine of S -->
    <path d="M 28 -20
             L -32 30
             L -62 30
             C -68 30, -72 26, -72 20
             L -72 -14
             L -24 -14
             L -24 4
             L 0 -16
             Z"
          fill="url(#sandGradient)"
          opacity="0.95" />

    <!-- Interlocking Center Bridge with Shadow Texture -->
    <path d="M -55 -15
             C -55 -15, -15 20, 25 20
             L 60 20
             C 74 20, 85 31, 85 45
             L 85 62
             L 37 62
             L 37 52
             C 37 46, 31 40, 25 40
             L -22 40
             C -44 40, -60 24, -60 2
             Z"
          fill="url(#sandGradient)"
          filter="url(#subtleDepth)" />

    <!-- S Lower Hook / Cap -->
    <path d="M 58 66
             L -38 66
             C -56 66, -72 50, -72 32
             L -72 18
             L -24 18
             L -24 26
             C -24 30, -20 34, -16 34
             L 58 34 Z" 
          fill="url(#sandGradient)" 
          filter="url(#castShadow)" />

    <!-- Fine Interlocking Depth Accent (Underlap Shadow) -->
    <path d="M -22 -14 L 32 -14 L -12 22 L -66 22 Z" 
          fill="#082A24" 
          opacity="0.45" />

    <!-- Upper Leaf Point Apex Facet -->
    <polygon points="95,-152 95,-86 65,-86" fill="#BFA38B" opacity="0.75" />
    
    <!-- Lower Leaf Point Apex Facet -->
    <polygon points="-95,152 -95,86 -65,86" fill="#BFA38B" opacity="0.75" />

  </g>
</svg>
