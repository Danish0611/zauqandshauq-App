<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-label="Luxury emerald olive glass Oud Royale perfume bottle with gold crown and crest">
<defs>
  <!-- Background Ambient Vignette -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#142c22"/>
    <stop offset="50%" stop-color="#0a1712"/>
    <stop offset="100%" stop-color="#040907"/>
  </linearGradient>

  <!-- Golden Radial Spotlight Aura -->
  <radialGradient id="glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#e5c178" stop-opacity="0.32"/>
    <stop offset="45%" stop-color="#c89d54" stop-opacity="0.14"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>

  <!-- Fluted Heavy Glass Bottle Body -->
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0d2119"/>
    <stop offset="18%" stop-color="#244f3d"/>
    <stop offset="38%" stop-color="#132e23"/>
    <stop offset="68%" stop-color="#0d2119"/>
    <stop offset="88%" stop-color="#2b5945"/>
    <stop offset="100%" stop-color="#091611"/>
  </linearGradient>

  <!-- Royal Metallic Gold Gradient for Cap and Accents -->
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#faeed4"/>
    <stop offset="25%" stop-color="#e5c178"/>
    <stop offset="55%" stop-color="#c89d54"/>
    <stop offset="85%" stop-color="#deb46a"/>
    <stop offset="100%" stop-color="#8a6125"/>
  </linearGradient>

  <!-- Cylindrical Cap Highlights -->
  <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7a541c"/>
    <stop offset="20%" stop-color="#faeed4"/>
    <stop offset="45%" stop-color="#e5c178"/>
    <stop offset="70%" stop-color="#9a6e2a"/>
    <stop offset="100%" stop-color="#5a3d13"/>
  </linearGradient>

  <!-- Drop Shadow for Glass Flacon Floating on Pedestal -->
  <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
  <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#e5c178" flood-opacity="0.45"/>
  </filter>
</defs>

<!-- Luxury Backdrop Frame with Oval Halo -->
<rect width="720" height="760" rx="40" fill="url(#bg)"/>
<ellipse cx="360" cy="380" rx="300" ry="320" fill="url(#glow)"/>

<!-- Geometric Concentric Luxury Rings -->
<circle cx="360" cy="360" r="245" fill="none" stroke="#e5c178" stroke-opacity="0.22" stroke-width="1"/>
<circle cx="360" cy="360" r="275" fill="none" stroke="#e5c178" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="3 9"/>

<!-- Pedestal Base Reflection Ellipse -->
<ellipse cx="360" cy="628" rx="175" ry="32" fill="#000000" opacity="0.8" filter="url(#shadow)"/>
<ellipse cx="360" cy="625" rx="135" ry="14" fill="#c89d54" opacity="0.18" filter="url(#shadow)"/>

<!-- ==========================================
     PERFUME BOTTLE (HAUTE PARFUMERIE FLACON)
     ========================================== -->

<!-- Heavy Gold Cap with Ribbed Texture -->
<rect x="306" y="160" width="108" height="68" rx="10" fill="url(#capGrad)" stroke="#faeed4" stroke-opacity="0.6"/>
<!-- Fine fluting lines on cap -->
<path d="M318 172 H394 M318 184 H394 M318 196 H394 M318 208 H394" stroke="#684719" stroke-opacity="0.65" stroke-width="1.2"/>

<!-- Collar Ring beneath Cap -->
<rect x="324" y="222" width="72" height="42" rx="4" fill="url(#gold)"/>
<path d="M336 230 V256 M350 230 V256 M364 230 V256 M378 230 V256 M392 230 V256" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>

<!-- Bottle Shoulders and Heavy Glass Walls -->
<path d="M 284 260 
         Q 280 260 274 278 
         L 242 342 
         Q 232 360 232 388 
         L 232 540 
         Q 232 576 272 586 
         Q 360 606 448 586 
         Q 488 576 488 540 
         L 488 388 
         Q 488 360 478 342 
         L 446 278 
         Q 440 260 436 260 Z" 
      fill="url(#glass)" 
      stroke="url(#gold)" 
      stroke-width="2.2"/>

<!-- Left Edge Glass Refraction Highlight -->
<path d="M 274 286 L 250 350 Q 244 366 244 394 L 244 532 Q 244 558 276 567" 
      fill="none" 
      stroke="#ffffff" 
      stroke-opacity="0.38" 
      stroke-width="8" 
      stroke-linecap="round"/>

<!-- Right Edge Deep Ambient Reflection -->
<path d="M 444 287 L 470 356 Q 476 371 476 394 L 476 532 Q 476 556 450 566" 
      fill="none" 
      stroke="#79a891" 
      stroke-opacity="0.25" 
      stroke-width="6" 
      stroke-linecap="round"/>

<!-- Luxury Dark Glass Inset Label Plate with Gold Border -->
<rect x="264" y="375" width="192" height="135" rx="8" 
      fill="#07130e" 
      stroke="url(#gold)" 
      stroke-width="1.8" 
      filter="url(#goldGlow)"/>

<!-- Inner Gold Inset Hairline -->
<rect x="270" y="381" width="180" height="123" rx="5" 
      fill="none" 
      stroke="#c89d54" 
      stroke-opacity="0.5" 
      stroke-width="0.8"/>

<!-- Royal Crown Crest on Bottle Label -->
<path d="M 346 404 Q 360 406 374 404 L 373 401 Q 360 403 347 401 Z" fill="url(#gold)"/>
<path d="M 347 400 L 341 389 Q 348 395 352 396 L 360 382 L 368 396 Q 372 395 379 389 L 373 400 Z" fill="url(#gold)"/>
<circle cx="360" cy="381" r="2" fill="url(#gold)"/>
<circle cx="340.5" cy="388.5" r="1.5" fill="url(#gold)"/>
<circle cx="379.5" cy="388.5" r="1.5" fill="url(#gold)"/>

<!-- Monogram ZS on Bottle Label -->
<path d="M 353 411 C 353 408, 356 405, 360 405 C 364 405, 367 408, 366 411 C 365 414, 361 416, 356 418 L 367 418 L 367 421 L 353 421 C 353 418, 356 415, 360 413 L 353 411 Z" fill="url(#gold)"/>

<!-- Bottle Typography -->
<text x="360" y="437" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="11" font-weight="600" letter-spacing="3.2" fill="#fffdfa">ZAUQ &amp; SHAUQ</text>
<text x="360" y="448" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="6.5" font-weight="500" letter-spacing="2.8" fill="#d8bfa7">— THE ART OF FRAGRANCE —</text>
<line x1="290" y1="454" x2="430" y2="454" stroke="#c89d54" stroke-opacity="0.45" stroke-width="0.8"/>

<text x="360" y="474" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="500" letter-spacing="2.5" fill="#faeed4">OUD ROYALE</text>
<text x="360" y="489" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="7.5" font-weight="600" letter-spacing="3.5" fill="#e5c178">EXTRAIT DE PARFUM</text>
<text x="360" y="501" text-anchor="middle" font-family="'DM Sans', sans-serif" font-size="6.5" letter-spacing="2.2" fill="#a5b3a2">100 ML · PARIS / JAIPUR</text>

<!-- Footnote Script -->
<text x="360" y="690" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="13" font-style="italic" letter-spacing="4" fill="#deb46a">Har Khushboo Ek Kahani Kehti Hai</text>
</svg>